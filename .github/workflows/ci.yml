name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  full-darwin:
    name: strict lint and test (darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: staticcheck
        run: $(go env GOPATH)/bin/staticcheck ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test -race ./...

      - name: Verify go.mod tidy
        run: go mod tidy && git diff --exit-code

  portable-linux:
    name: portable packages (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: staticcheck detector and renderutil
        run: $(go env GOPATH)/bin/staticcheck ./detector/... ./internal/...

      - name: go test -race
        run: go test -race ./detector/... ./internal/...

  vulncheck:
    name: govulncheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: $(go env GOPATH)/bin/govulncheck ./...
